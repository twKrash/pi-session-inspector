name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v1.0.0
        required: true

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance via the repository's trusted publisher

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Refuse a tag that disagrees with the package version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match package version $version"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install from the lockfile
        run: npm ci

      - name: Gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run build:web:check
          npm run knip
          npm run depcruise
          npm run publint
          npm test
          npm run test:invariants

      - name: Pack the release artifact and record its hashes
        run: |
          set -eu
          npm pack --json > pack.json
          tarball="$(node -p "require('./pack.json')[0].filename")"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "### Packed artifact" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha1sum "$tarball" >> "$GITHUB_STEP_SUMMARY"
          sha512sum "$tarball" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the CHANGELOG section for this version
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          awk -v v="$version" \
            '$0 ~ "^## \\[" v "\\]" { flag = 1; next } /^## \[/ { flag = 0 } flag' \
            CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

      - name: Publish, unless this version is already on the registry
        run: |
          set -eu
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping publish"
            exit 0
          fi
          npm publish "$TARBALL" --access public --provenance

      - name: Verify the registry serves exactly these bytes
        run: |
          set -eu
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          local_sha1="$(sha1sum "$TARBALL" | cut -d' ' -f1)"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          remote_sha1="$(npm view "$name@$version" dist.shasum)"
          remote_integrity="$(npm view "$name@$version" dist.integrity)"
          echo "local  $local_sha1  $local_integrity"
          echo "remote $remote_sha1  $remote_integrity"
          if [ "$local_sha1" != "$remote_sha1" ] || [ "$local_integrity" != "$remote_integrity" ]; then
            echo "::error::registry contents differ from the packed artifact"
            exit 1
          fi

      - name: Create the GitHub release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it in place"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "${TAG#v}" \
            --notes-file notes.md \
            --attach "$TARBALL"
